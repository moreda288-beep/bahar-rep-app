<style>

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --wa:#4CC17E; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

.app{max-width:480px;margin:0 auto;min-height:100%}
.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:14px}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}

.btn{height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-fg);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-align:center}
.btn.sec{background:var(--surface-2);color:var(--fg);font-weight:600}

.btn.waBtn{background:var(--wa);color:#fff}

.stepper{display:flex;align-items:center;gap:6px}

.stepper span{min-width:30px;text-align:center;font-weight:700}
.line{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--track)}
.line:last-child{border-bottom:0}
.sw{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.c-spice{background:#F3D9C9;color:#8C3A1A} .c-flavor{background:#FBEBC4;color:#7A5300} .c-blend{background:#DCE8D5;color:#2F5A30} .c-herb{background:#E3E9D2;color:#4A5A20}
.photos{display:flex;gap:8px;flex-wrap:wrap}

.upl{position:relative;width:84px;height:84px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;flex-shrink:0}

.ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.bad{background:var(--bad-bg);color:var(--bad)} .ic.neu{background:var(--surface-2);color:var(--accent)}

details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}

.items{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:14px;margin-top:12px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--track);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:left}
.note{border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}

.file{background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px}

.avatar{border-radius:50%;background:var(--gold);color:#2A1F17;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;min-height:48px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.abar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.abar-in{max-width:448px;margin:0 auto;display:flex;gap:10px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.cele{min-height:100%;background:#2A1F17;color:#FBF7F1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:64px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.cele .badge{width:116px;height:116px;border-radius:58px;background:#E9B23A;color:#2A1F17;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(233,178,58,.16)}

.cele .st b{font-size:21px;color:#E9B23A}
.confetti{position:absolute;border-radius:3px}
.banner{font-size:12px;text-align:center;color:var(--muted);padding:6px}
.adm{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}

.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:18px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.tbl th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--track);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
textarea.input{height:auto;min-height:72px;padding:10px 14px;resize:vertical;line-height:1.6}
.mini{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}

const ic=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

// ---------- empty start ----------
function blank(){
  return {v:1,rep:{name:'',phone:'',area:'',code:'',photo:null,target:0,commission:2},products:[],merchants:[],invoices:[],payments:[],files:[],nextInv:1001,nextRec:1001};
}
let S;
function load(){ try{const r=localStorage.getItem(KEY); if(r){S=JSON.parse(r); if(S&&S.v===1) return;} }catch(e){} S=blank(); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ toast('المساحة على الجهاز مش كفاية لحفظ كل الصور، جرّب صور أقل'); } }
load();

// ---------- derived ----------
const M=id=>S.merchants.find(m=>m.id===id);
const invOf=mid=>S.invoices.filter(i=>i.mid===mid);
const payOf=mid=>S.payments.filter(p=>p.mid===mid);
const net=i=>i.total-(i.discount||0);
const balance=mid=>invOf(mid).reduce((s,i)=>s+net(i),0)-payOf(mid).reduce((s,p)=>s+p.amount,0);
const goods=mid=>invOf(mid).reduce((s,i)=>s+net(i),0);
const paid=mid=>payOf(mid).reduce((s,p)=>s+p.amount,0);
function status(m){
  const b=balance(m.id);
  if(b<=0) return {k:'paid',t:'مسدّد'};
  if(!m.nextDue) return {k:'open',t:'عليه رصيد'};
  const d=diff(TODAY,m.nextDue);
  if(d<0) return {k:'late',t:'متأخر '+daysWord(-d)};
  if(d===0) return {k:'soon',t:'ميعاده النهارده'};
  if(d<=3) return {k:'soon',t:d===1?'ميعاده بكرة':'بعد '+daysWord(d)};
  return {k:'open',t:'ميعاده '+fdate(m.nextDue)};
}
const kg=l=>l.unit==='كجم'?l.qty:l.unit==='جرام'?l.qty/1000:0;
function volume(mid){ const from=addDays(TODAY,-30); return invOf(mid).filter(i=>i.date>=from).reduce((s,i)=>s+i.lines.reduce((a,l)=>a+kg(l),0),0); }
function tierOf(v){ let t=null; TIERS.forEach(x=>{ if(v>=x.kg) t=x; }); return t; }
function nextTier(v){ return TIERS.find(x=>v<x.kg)||null; }
const monthKey=s=>s.slice(0,7);
const sumPay=f=>S.payments.filter(f).reduce((s,p)=>s+p.amount,0);

// ---------- ui state ----------
let ui={view:'home',stack:[],mq:'',mf:'all',ff:'all'};
function go(view,params,opts){
  opts=opts||{};
  if(opts.tab){ ui.stack=[]; } else if(!opts.replace){ ui.stack.push({view:ui.view,mid:ui.mid}); }
  ui.view=view; if(params&&params.mid!==undefined) ui.mid=params.mid;
  render(); window.scrollTo(0,0);
}
function back(){ const p=ui.stack.pop(); if(p){ ui.view=p.view; ui.mid=p.mid; } else ui.view='home'; render(); window.scrollTo(0,0); }
let tt;
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{el.hidden=true;},2600); }
function setPath(p,v){ const k=p.split('.'); let o=ui; for(let i=0;i<k.length-1;i++){ o=o[k[i]]=o[k[i]]||{}; } o[k[k.length-1]]=v; }

// ---------- shared pieces ----------
const top=(title,sub,extra)=>`<header class="top"><button class="iconbtn" data-act="back" aria-label="رجوع">${ic('back',20,2)}</button><div class="titles"><h1 style="font-size:19px">${title}</h1>${sub?`<span class="small muted">${sub}</span>`:''}</div>${extra||''}</header>`;
const avatar=(size)=>`<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.8)}px">${S.rep.photo?`<img src="${S.rep.photo}" alt="صورة المندوب">`:esc(initials(S.rep.name))}</span>`;
const swatch=p=>`<span class="sw c-${p.cat||'spice'}">${esc((p.name||'').charAt(0))}</span>`;
function merchantOptions(sel,onlyDebt){
  return `<option value="">اختار التاجر…</option>`+S.merchants.filter(m=>!onlyDebt||balance(m.id)>0).map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.shop)} — ${esc(m.area)}${onlyDebt?' (عليه '+fmt(balance(m.id))+')':''}</option>`).join('');
}
function waLink(phone,text){ return 'https://wa.me/'+waNum(phone)+'?text='+encodeURIComponent(text); }

  <section class="card hero">

function merchantList(){
  if(!S.merchants.length) return `<div class="card" style="align-items:center;text-align:center;gap:8px;padding:28px 16px"><b>قائمة التجار فاضية</b><span class="small muted">أي تاجر تضيفه هيظهر هنا بحالته: مسدّد، قرّب ميعاده، أو متأخر.</span><button class="btn" style="margin-top:6px;width:100%" data-act="newMerchant">${ic('plus',18,2.2)}إضافة تاجر</button></div>`;

  if(ui.mf!=='all') arr=arr.filter(x=>x.s.k===ui.mf || (ui.mf==='open'&&x.s.k==='open'));

    </div>

};

function orderTotals(){
  const o=ui.order; const lines=Object.keys(o.lines).filter(k=>o.lines[k]>0).map(k=>{const p=S.products.find(x=>x.id===k);return {p,qty:o.lines[k]};}).filter(x=>x.p);
  const total=lines.reduce((s,l)=>s+l.qty*l.p.price,0);
  const disc=o.terms==='cash'?Math.round(total*0.02):0;
  const netT=total-disc;
  const paidNow=o.terms==='cash'?netT:Math.min(netT,toNum(o.paid));
  return {lines,total,disc,net:netT,paidNow,rem:netT-paidNow,kg:lines.reduce((s,l)=>s+kg({unit:l.p.unit,qty:l.qty}),0)};
}
function orderLive(){
  const T=orderTotals(), o=ui.order, m=M(o.mid);
  const r=$('#oRem'); if(r) r.textContent=money(T.rem);
  const w=$('#oWarn'); if(w){ let h=''; if(toNum(o.paid)>T.net&&o.terms!=='cash') h=`<div class="note bad">${ic('alert',20)}المبلغ أكبر من إجمالي الطلبية</div>`;
    else if(m&&T.rem>0&&balance(m.id)+T.rem>m.limit) h=`<div class="note warn">${ic('alert',20)}كده التاجر هيعدّي حد الائتمان (${money(m.limit)}) بـ ${money(balance(m.id)+T.rem-m.limit)}</div>`; w.innerHTML=h; }
  const tt=$('#oTotal'); if(tt) tt.textContent=money(T.net);
}

// ---------- cloud control (shared with the owner's control panel) ----------
const APP_VERSION='1.0.0';
const CTL_DEFAULT={status:'active',message:'',latest:'1.0.0',minVersion:'1.0.0',notes:'',requireCode:false};
const cloud={db:null,user:null,uid:null,isAdmin:null,inited:false,ready:false,ctl:{},dev:null,codes:[],devices:[],adminSubs:false,codeChecked:false};
const cmpVer=(a,b)=>{const x=String(a||'0').split('.').map(Number),y=String(b||'0').split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1;}return 0;};
const nextVer=v=>{const p=String(v||'1.0.0').split('.').map(n=>Number(n)||0);while(p.length<3)p.push(0);p[2]++;return p.join('.');};
const ctlOf=app=>Object.assign({},CTL_DEFAULT,cloud.ctl[app]||{});
let actCode=null; try{actCode=localStorage.getItem('bahar-act');}catch(e){}
function deviceLabel(){ const u=navigator.userAgent||''; const os=/Android/i.test(u)?'أندرويد':/iPhone|iPad/i.test(u)?'آيفون':/Windows/i.test(u)?'ويندوز':/Mac/i.test(u)?'ماك':'جهاز'; const br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':''; return os+(br?' • '+br:''); }
const codeOk=(d,app)=>!!d&&d.status==='active'&&(d.app||'rep')===app&&(!d.expires||d.expires>=TODAY);
const normCode=s=>{ let t=String(s||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).toUpperCase().replace(/[^A-Z0-9]/g,''); if(t.length===11&&t.startsWith('BHR')) t='BHR-'+t.slice(3,7)+'-'+t.slice(7); return t; };
async function registerDevice(){
  if(!cloud.db||!cloud.uid) return;
  try{ const ref=cloud.db.doc('devices/'+cloud.uid); const s=await ref.get();
    const body={app:'rep',name:S.rep.name||'',phone:S.rep.phone||'',version:APP_VERSION,lastSeen:Date.now(),ua:deviceLabel(),code:actCode||''};
    if(s.exists) await ref.update(body); else await ref.set(Object.assign({blocked:false,firstSeen:Date.now()},body));
  }catch(e){}
}
async function checkCode(){
  if(cloud.codeChecked||!actCode||!cloud.db) return; cloud.codeChecked=true;
  try{ const s=await cloud.db.doc('codes/'+actCode).get(); if(!codeOk(s.exists?s.data():null,'rep')){ actCode=null; try{localStorage.removeItem('bahar-act');}catch(e){} render(); } }catch(e){}
}
async function cloudInit(){
  try{ if(window.claude&&window.claude.use){ cloud.db=await window.claude.use('db'); cloud.user=await window.claude.use('user'); } }catch(e){}
  if(cloud.db){
    try{ cloud.uid=cloud.user?await cloud.user.id():null; cloud.isAdmin=cloud.user?await cloud.user.canEdit():false; }catch(e){ cloud.isAdmin=false; }
    cloud.db.doc('control/rep').onSnapshot(s=>{ cloud.ctl.rep=s.exists?s.data():null; cloud.ready=true; checkCode(); render(); },()=>{ cloud.ready=false; });
    if(cloud.uid){ cloud.db.doc('devices/'+cloud.uid).onSnapshot(s=>{ cloud.dev=s.exists?s.data():null; render(); },()=>{}); registerDevice(); }
  }
  cloud.inited=true; render();
}
const gateHTML=(icn,tone,title,text,btn)=>`<div class="gate"><span class="bigic" style="background:var(--${tone}-bg);color:var(--${tone})">${ic(icn,44,1.8)}</span><h1 style="font-size:23px">${title}</h1><p class="muted" style="margin:0;line-height:1.8;white-space:pre-line">${esc(text)}</p>${btn||''}</div>`;
function gate(){
  if(!cloud.db||!cloud.ready) return '';
  const c=ctlOf('rep');
  if(cloud.dev&&cloud.dev.blocked) return gateHTML('lock','bad','الجهاز ده موقوف','تواصل مع الإدارة عشان يرجع يشتغل.');
  if(c.status==='locked') return gateHTML('lock','bad','التطبيق مقفول حالياً',c.message||'تواصل مع الإدارة.');
  if(c.status==='maintenance') return gateHTML('clock','warn','التطبيق تحت الصيانة',c.message||'هيرجع يشتغل قريب.',`<button class="btn sec" data-act="reloadApp" style="width:100%">جرّب تاني</button>`);
  if(cmpVer(APP_VERSION,c.minVersion)<0) return gateHTML('download','warn','فيه تحديث إجباري','لازم تحدّث لإصدار '+c.minVersion+' عشان تكمل.'+(c.notes?'\n\n'+c.notes:''),`<button class="btn" data-act="reloadApp" style="width:100%">${ic('download',20)}حدّث دلوقتي</button><span class="small muted">إصدارك الحالي <span class="mono">${APP_VERSION}</span></span>`);

    <div id="actErr" style="width:100%"></div><button class="btn" data-act="activate" style="width:100%">فعّل</button></div>`;
  return '';
}
function banner(){
  if(!cloud.ready) return '';

}

async function saveCtl(app,patch){
  if(!cloud.db) return false;
  try{ await cloud.db.doc('control/'+app).set(Object.assign({},ctlOf(app),patch,{updatedAt:Date.now()})); return true; }
  catch(e){ toast('مقدرتش أحفظ. اتأكد إنك داخل بحساب صاحب التطبيق'); return false; }
}

// ---------- images ----------
function readImg(file,max){
  return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ try{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.72)); }catch(e){ res(fr.result); } }; img.onerror=()=>res(null); img.src=fr.result; }; fr.onerror=()=>res(null); fr.readAsDataURL(file); });
}
async function onFiles(el){
  const files=Array.from(el.files||[]); el.value=''; if(!files.length) return;
  const kind=el.dataset.file;
  if(kind==='collect'){ const room=2-ui.collect.photos.length; for(const f of files.slice(0,room)){ const d=await readImg(f,900); if(d) ui.collect.photos.push(d); } if(files.length>room) toast('أقصى حاجة صورتين في التحصيل'); render(); }
  else if(kind==='merchant'){ let n=0; for(const f of files.slice(0,4)){ const d=await readImg(f,900); if(d){ S.files.push({id:uid(),mid:ui.mid,kind:ui.upKind||'receipt',label:FILEKINDS[ui.upKind||'receipt']+' '+fdate(TODAY),date:TODAY,img:d}); n++; } } save(); ui.ff='all'; render(); if(n) toast(n===1?'الصورة اتحفظت في ملف التاجر':'الصور اتحفظت في ملف التاجر'); }
  else if(kind==='rep'){ const d=await readImg(files[0],400); if(d){ S.rep.photo=d; save(); render(); toast('الصورة اتغيرت'); } }
}

  admDevF:d=>{ ui.adm.devF=d.k; render(); },
  admStatus:async d=>{ if(await saveCtl(d.app,{status:d.k})) toast(APPNAME[d.app]+': '+({active:'شغال',maintenance:'صيانة',locked:'مقفول'}[d.k])); },
  admMsg:async d=>{ const m=ui.adm.msg[d.app]!=null?ui.adm.msg[d.app]:ctlOf(d.app).message; if(await saveCtl(d.app,{message:String(m||'').trim()})){ ui.adm.msg[d.app]=null; toast('الرسالة اتبعتت'); } },
  admMsgClear:async d=>{ if(await saveCtl(d.app,{message:''})){ ui.adm.msg[d.app]=null; toast('الرسالة اتمسحت'); } },
  admUpdate:async d=>{
    const u=ui.adm.upd[d.app], c=ctlOf(d.app); const v=String(u.ver||'').trim()||nextVer(c.latest);
    if(!/^\d+\.\d+\.\d+$/.test(v)){ toast('رقم الإصدار لازم يكون زي 1.0.1'); return; }
    if(cmpVer(v,c.latest)<0){ toast('الإصدار ده أقدم من آخر إصدار ('+c.latest+')'); return; }
    if(await saveCtl(d.app,{latest:v,notes:String(u.notes||'').trim(),minVersion:u.force?v:c.minVersion})){ ui.adm.upd[d.app]={ver:'',notes:'',force:false}; toast('التحديث '+v+' نزل'+(u.force?' (إجباري)':'')); }
  },
  admReq:async (d,el)=>{ if(await saveCtl(d.app,{requireCode:el.checked})) toast(el.checked?'التفعيل بالكود بقى مطلوب':'التفعيل بالكود اتلغى'); },
  admGen:async()=>{
    const nc=ui.adm.nc, AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', part=()=>Array.from({length:4},()=>AL[Math.floor(Math.random()*AL.length)]).join('');
    const code='BHR-'+part()+'-'+part(), days=Number(nc.days)||0;
    try{ await cloud.db.doc('codes/'+code).set({app:nc.app,label:String(nc.label||'').trim(),status:'active',createdAt:new Date().toISOString(),expires:days?addDays(TODAY,days):null}); ui.adm.nc.label=''; toast('الكود '+code+' جاهز'); }
    catch(e){ toast('مقدرتش أطلع الكود'); }
  },
  admCopy:d=>{ try{ navigator.clipboard.writeText(d.code).then(()=>toast('الكود اتنسخ')).catch(()=>toast('انسخه يدوي: '+d.code)); }catch(e){ toast('انسخه يدوي: '+d.code); } },
  admRevoke:async d=>{ try{ await cloud.db.doc('codes/'+d.code).update({status:'revoked'}); toast('الكود اتلغى'); }catch(e){ toast('مقدرتش ألغي الكود'); } },
  admRestore:async d=>{ try{ await cloud.db.doc('codes/'+d.code).update({status:'active'}); toast('الكود رجع يشتغل'); }catch(e){ toast('مقدرتش أرجّع الكود'); } },
  admBlock:async d=>{ const dv=cloud.devices.find(x=>x.id===d.id); if(!dv) return; try{ await cloud.db.doc('devices/'+d.id).update({blocked:!dv.blocked}); toast(dv.blocked?'الجهاز رجع يشتغل':'الجهاز اتوقف'); }catch(e){ toast('مقدرتش أغيّر حالة الجهاز'); } },
  askReset:()=>{ ui.confirmReset=true; render(); },
  cancelReset:()=>{ ui.confirmReset=false; render(); },
  doReset:()=>{ S=blank(); save(); ui={view:'home',stack:[],mq:'',mf:'all',ff:'all'}; render(); toast('اتمسحت كل البيانات'); }
};

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const f=A[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset,el); } });
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset||!el.dataset.model||el.type==='checkbox'||el.tagName==='SELECT') return; setPath(el.dataset.model,el.value);
  const p=el.dataset.model;
  if(p==='mq'){ const l=$('#mlist'); if(l) l.innerHTML=merchantList(); }
  else if(p==='pq'){ const l=$('#plist'); if(l) l.innerHTML=pickerList(); }
  else if(p==='collect.amount') collectLive();
  else if(p==='order.paid') orderLive();
});
document.addEventListener('change',e=>{ const el=e.target; if(el.dataset&&el.dataset.file){ onFiles(el); return; }
  if(el.dataset&&el.dataset.actChange){ const f=A[el.dataset.actChange]; if(f) f(el.dataset,el); return; }
  if(el.dataset&&el.dataset.model){ setPath(el.dataset.model, el.type==='checkbox'?el.checked:el.value);
    if(el.dataset.model==='order.mid'){ const m=M(el.value); if(m) ui.order.terms=m.terms; }
    if(el.dataset.model==='collect.mid'){ ui.collect.amount=''; }
    if(el.hasAttribute('data-rerender')) render(); }
});

window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
render();
cloudInit();
})();
</script>

</body>
</html>
